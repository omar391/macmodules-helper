[package]
name = "scriptd-bridge"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Minimal signed companion bridge for Scriptd desktop applications."

[dependencies]
anyhow = "1.0"
hex = "0.4"
libc = "0.2"
quick-xml = "0.42"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
scriptd-bridge-protocol = { path = "../scriptd-bridge-protocol" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = { version = "0.3.2", features = ["CFData", "CFDictionary", "CFNumber", "CFString"] }
objc2-security = { version = "0.3.2", features = ["Authorization", "AuthorizationDB", "AuthorizationTags", "CSCommon", "SecCode"] }

[dev-dependencies]
tempfile = "3.10"
